<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
    <link rel="stylesheet" href="../Css/CSS.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
    <script src="../JavaScript/ServicesTable_JS.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <div class="header_logo">
                <a href="HP.html#top"> <img src="../Images/Logo.png" alt="logo"></a>
            </div>
            <nav class="header_nav">
                <ul>
                    <li><a href="HP.html#about_us">私たちについて</a></li>
                    <li><a href="HP.html#services">サービス</a></li>
                    <li><a href="HP.html#payment">お支払方法</a></li>
                    <li><a href="HP.html#consultation">ご相談</a></li>
                </ul>
            </nav>
                <div class="header_contacts">
                    <p><span class="highlight">営業時間 </span> 10:00~19:00<br/>月曜定休</p>
                    <a href="tel:0801234567">080-0123-4567</a>
                </div>
        </div>
    </header>

    <section class="table">
        <div class="table_inner">
            <h1>サービス一覧表</h1>
            <div class="table_description">
                <p>
                    下記の当店のサービス一覧表を掲載しております。<br/>
                    <span class="highlight">排気量</span>と<span class="highlight">サービス内容</span>を選びいただくと、該当するサービスをご覧いただけます。
                </p>
            </div>
            <div class="pricing">
                <div class="bike-size">
                    <label><input type="radio" name="size" value="small"> 小型</label>
                    <label><input type="radio" name="size" value="medium" checked> 中型</label>
                    <label><input type="radio" name="size" value="large"> 大型</label>
                </div>

                <div class="category-tabs">
                    <button class="tab active" data-category="repair">修理</button>
                    <button class="tab" data-category="custom">カスタム</button>
                    <button class="tab" data-category="maintenance">メンテナンス</button>
                </div>

                <table class="service-table">
                    <thead>
                        <tr>
                        <th>排気量</th>
                        <th>サービス</th>
                        <th>料金</th>
                        </tr>
                    </thead>
                    <tbody id="service-body">
                    </tbody>
                </table>
                <div class="pricing-buttons">
                    <a href="HP.html#consultation" class="btn orange">ご相談</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer_wrap">
            <div class="footer_inner">
                <div class="footer_sns">
                    <a href="https://www.line.me/ja/"><img src="../Icons/line.png" alt="line" ></a>
                    <a href="https://x.com/"><img src="../Icons/twitter.png" alt="twitter" ></a>
                    <a href="https://www.instagram.com/"><img src="../Icons/instagram.png" alt="insta" ></a>
                    <a href="https://www.youtube.com/"><img src="../Icons/youtube.png" alt="youtube" ></a>
                </div>
                <div class="footer_kurosteel">
                    <p> KUROSTEEL(c)</p>
                </div>
            </div>
        </div>
    </footer>
        <button id="scroll_top_btn" title="Go to top">▲</button>
</body>
</html>
